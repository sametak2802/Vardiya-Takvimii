name: APK

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Derle
        run: |
          unzip -q -o "$(ls *.zip | sort -V | tail -1)" -d src
          cd src/NSapp
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../NSapp.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: NSapp ${{ github.run_number }}
          files: NSapp.apk
